name: RTL smoke
on:
  push:
  pull_request:
jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run directed smoke
        run: |
          iverilog -g2012 -s tb_elastic_buffer -o simv rtl/elastic_buffer.sv tb/tb_elastic_buffer.sv
          vvp simv

      - name: Run credit TX smoke
        run: |
          iverilog -g2012 -s tb_credit_tx -o simv_credit rtl/credit_tx.sv tb/tb_credit_tx.sv
          vvp simv_credit

      - name: Run link manager smoke
        run: |
          iverilog -g2012 -s tb_link_manager -o simv_link rtl/link_manager.sv tb/tb_link_manager.sv
          vvp simv_link
      - name: Compile streaming integration
        run: |
          iverilog -g2012 -s stream_adapter -o simv_stream rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv

      - name: Run streaming link-down regression
        run: |
          iverilog -g2012 -s tb_stream_adapter -o simv_stream_tb rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv tb/tb_stream_adapter.sv
          vvp simv_stream_tb

      - name: Run continuous-throughput regression
        run: |
          iverilog -g2012 -s tb_elastic_throughput -o simv_throughput rtl/elastic_buffer.sv tb/tb_elastic_throughput.sv
          vvp simv_throughput

      - name: Run CRC-16 known-vector regression
        run: |
          iverilog -g2012 -s tb_crc16_ccitt -o simv_crc rtl/crc16_ccitt.sv tb/tb_crc16_ccitt.sv
          vvp simv_crc
