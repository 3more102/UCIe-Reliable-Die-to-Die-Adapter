name: RTL smoke
on:
  push:
  pull_request:
jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL simulation and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run directed smoke
        run: |
          iverilog -g2012 -s tb_elastic_buffer -o simv rtl/elastic_buffer.sv tb/tb_elastic_buffer.sv
          vvp simv

      - name: Run credit TX smoke
        run: |
          iverilog -g2012 -s tb_credit_tx -o simv_credit rtl/credit_tx.sv tb/tb_credit_tx.sv
          vvp simv_credit

      - name: Run credit TX boundary regression
        run: |
          iverilog -g2012 -s tb_credit_tx_boundaries -o simv_credit_boundaries rtl/credit_tx.sv tb/tb_credit_tx_boundaries.sv
          vvp simv_credit_boundaries

      - name: Run randomized and stress elastic buffer regressions
        run: |
          iverilog -g2012 -s tb_elastic_buffer_random -o simv_elastic_random rtl/elastic_buffer.sv tb/tb_elastic_buffer_random.sv
          vvp simv_elastic_random
          iverilog -g2012 -s tb_elastic_buffer_stress -o simv_elastic_stress rtl/elastic_buffer.sv tb/tb_elastic_buffer_stress.sv
          vvp simv_elastic_stress

      - name: Run generic CRC reference tests
        run: python3 tb/tb_crc16_reference.py

      - name: Run RTL CRC known-answer test
        run: |
          iverilog -g2012 -s tb_crc16_ccitt -o simv_crc rtl/crc16_ccitt.sv tb/tb_crc16_ccitt.sv
          vvp simv_crc

      - name: Run generic receive integrity and duplicate suppression regression
        run: |
          iverilog -g2012 -s tb_generic_crc_rx -o simv_crc_rx rtl/crc16_ccitt.sv rtl/generic_crc_rx.sv tb/tb_generic_crc_rx.sv
          vvp simv_crc_rx

      - name: Run generic replay sender response and retry boundary regression
        run: |
          iverilog -g2012 -s tb_generic_replay_tx -o simv_replay_tx rtl/crc16_ccitt.sv rtl/generic_replay_tx.sv tb/tb_generic_replay_tx.sv
          vvp simv_replay_tx

      - name: Run link manager smoke
        run: |
          iverilog -g2012 -s tb_link_manager -o simv_link rtl/link_manager.sv tb/tb_link_manager.sv
          vvp simv_link
      - name: Compile streaming integration
        run: |
          iverilog -g2012 -s stream_adapter -o simv_stream rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv

      - name: Synthesize streaming integration for 48 and 64 GT/s digital profiles
        run: |
          for profile in 48 64; do
            yosys -Q -p "read_verilog -sv rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv; chparam -set RATE_PROFILE_GT_S ${profile} stream_adapter; hierarchy -check -top stream_adapter; proc; opt; check; synth -top stream_adapter; check; stat"
          done

      - name: Simulate reliable digital model at 48 and 64 GT/s profiles
        run: |
          for profile in 48 64 32; do
            iverilog -g2012 -Ptb_reliable_stream_model.RATE_PROFILE_GT_S=${profile} -s tb_reliable_stream_model -o simv_reliable rtl/elastic_buffer.sv rtl/crc16_ccitt.sv rtl/credit_tx.sv rtl/link_manager.sv rtl/generic_replay_tx.sv rtl/generic_crc_rx.sv rtl/reliable_stream_model.sv tb/tb_reliable_stream_model.sv
            vvp simv_reliable
          done

      - name: Run deterministic randomized reliability regression
        run: |
          for profile in 48 64; do
            iverilog -g2012 -Ptb_reliable_stream_random.RATE_PROFILE_GT_S=${profile} -s tb_reliable_stream_random -o simv_reliable_random rtl/elastic_buffer.sv rtl/crc16_ccitt.sv rtl/credit_tx.sv rtl/link_manager.sv rtl/generic_replay_tx.sv rtl/generic_crc_rx.sv rtl/reliable_stream_model.sv tb/tb_reliable_stream_random.sv
            vvp simv_reliable_random
          done

      - name: Synthesize reliable digital model at 48 and 64 GT/s profiles
        run: |
          for profile in 48 64; do
            yosys -Q -p "read_verilog -sv rtl/elastic_buffer.sv rtl/crc16_ccitt.sv rtl/credit_tx.sv rtl/link_manager.sv rtl/generic_replay_tx.sv rtl/generic_crc_rx.sv rtl/reliable_stream_model.sv; chparam -set RATE_PROFILE_GT_S ${profile} reliable_stream_model; hierarchy -check -top reliable_stream_model; proc; opt; check; synth -top reliable_stream_model; check; stat"
          done

      - name: Run streaming link-down retention regression
        run: |
          iverilog -g2012 -s tb_stream_link_hold -o simv_stream_hold rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv tb/tb_stream_link_hold.sv
          vvp simv_stream_hold

      - name: Run reset isolation regression at 48 and 64 GT/s profiles
        run: |
          for profile in 48 64; do
            iverilog -g2012 -Ptb_stream_reset.RATE_PROFILE_GT_S=${profile} -s tb_stream_reset -o simv_stream_reset rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv tb/tb_stream_reset.sv
            vvp simv_stream_reset
          done

      - name: Run 48, 64, and unsupported digital profile regressions
        run: |
          for profile in 48 64 32; do
            iverilog -g2012 -Ptb_stream_rate_profile.RATE_PROFILE_GT_S=${profile} -s tb_stream_rate_profile -o simv_rate_profile rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv tb/tb_stream_rate_profile.sv
            vvp simv_rate_profile
          done

      - name: Run randomized adapter profile regressions
        run: |
          for profile in 48 64; do
            iverilog -g2012 -Ptb_stream_random.RATE_PROFILE_GT_S=${profile} -s tb_stream_random -o simv_stream_random rtl/elastic_buffer.sv rtl/credit_tx.sv rtl/stream_adapter.sv tb/tb_stream_random.sv
            vvp simv_stream_random
          done
